<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البنك الأهلي المصري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DGWWbn-x.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="__diag" style="position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;padding:8px 12px;font-size:12px;z-index:999999;font-family:monospace;direction:ltr;max-height:50vh;overflow:auto">
      <pre id="__log" style="margin:0;white-space:pre-wrap">v10: testing imports...</pre>
    </div>

    <script>
      var logEl = document.getElementById('__log');
      var logs = ['v10 started'];
      function dlog(msg) {
        logs.push(msg);
        logEl.textContent = logs.join('\n');
      }
      window.onerror = function(msg, src, line) { dlog('ERR: ' + msg + ' @' + (src||'').split('/').pop() + ':' + line); };
      window.addEventListener('unhandledrejection', function(e) {
        dlog('REJECT: ' + (e.reason && (e.reason.message || e.reason) || 'unknown'));
      });
      window.addEventListener('vite:preloadError', function(e) {
        dlog('VITE_PRELOAD_ERR: ' + (e.payload && (e.payload.message || e.payload) || 'unknown'));
      });
    </script>

    <script type="module">
      var logEl = document.getElementById('__log');
      var logs = window.__v10logs || [];
      function dlog(msg) {
        logs.push(msg);
        logEl.textContent = logs.join('\n');
      }
      window.__v10logs = logs;

      dlog('module script running');

      // Test 1: fetch a chunk file to check MIME type
      try {
        var r = await fetch("/assets/watchImages-C8Ae7xNl.js");
        dlog('fetch watchImages: ' + r.status + ' type=' + r.headers.get('content-type'));
      } catch(e) {
        dlog('fetch FAIL: ' + e.message);
      }

      // Test 2: import a LEAF module (no circular deps)
      try {
        dlog('importing watchImages...');
        var t0 = Date.now();
        var m1 = await import("/assets/watchImages-C8Ae7xNl.js");
        dlog('watchImages OK in ' + (Date.now()-t0) + 'ms keys=' + Object.keys(m1).join(','));
      } catch(e) {
        dlog('watchImages FAIL: ' + e.message);
      }

      // Test 3: import the MAIN bundle (to check it loads as module)
      try {
        dlog('importing main bundle...');
        var t1 = Date.now();
        var m2 = await import("/assets/index-D-1BwIyM.js");
        dlog('main bundle OK in ' + (Date.now()-t1) + 'ms keys=' + Object.keys(m2).slice(0,5).join(','));
      } catch(e) {
        dlog('main bundle FAIL: ' + e.message);
      }

      // Test 4: import Home (has circular dep with main bundle)
      try {
        dlog('importing Home...');
        var t2 = Date.now();
        var m3 = await import("/assets/Home-aj-xKnYx.js");
        dlog('Home OK in ' + (Date.now()-t2) + 'ms keys=' + Object.keys(m3).join(','));
      } catch(e) {
        dlog('Home FAIL: ' + e.message);
      }

      // Report final DOM state
      setTimeout(function() {
        var root = document.getElementById('root');
        dlog('---DOM after 3s---');
        dlog('root kids=' + root.children.length + ' html=' + root.innerHTML.length + 'ch');
        for (var i = 0; i < Math.min(root.children.length, 5); i++) {
          var c = root.children[i];
          dlog('  [' + i + '] <' + c.tagName + '> h=' + c.offsetHeight + 'px');
        }
      }, 3000);
    </script>
  </body>
</html>
<!-- v10 deploy -->
