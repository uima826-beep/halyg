<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البنك الأهلي المصري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DGWWbn-x.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="__v" style="position:fixed;top:0;right:0;background:#1B7A3D;color:#fff;padding:4px 12px;font-size:12px;z-index:999999;font-family:monospace">v7</div>
    <script type="module" crossorigin src="/assets/index-D-1BwIyM.js"></script>
    <script>
      setTimeout(function() {
        var root = document.getElementById('root');
        var v = document.getElementById('__v');
        if (!root) { v.textContent = 'v7: NO ROOT'; return; }
        v.textContent = 'v7 | root=' + root.innerHTML.length + 'ch | kids=' + root.children.length;
        v.style.background = root.innerHTML.length > 10 ? '#f59e0b' : '#dc2626';
        v.style.color = '#000';

        if (root.innerHTML.length > 10 && root.children.length > 0) {
          var el = root.firstElementChild;
          var cs = window.getComputedStyle(el);
          v.textContent += ' | ' + el.tagName + ' d=' + cs.display + ' v=' + cs.visibility + ' o=' + cs.opacity + ' h=' + cs.height;

          var allText = root.textContent.trim();
          if (allText) {
            v.textContent += ' | text="' + allText.substring(0, 30) + '"';
          }
        }
      }, 4000);
    </script>
  </body>
</html>
