<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البنك الأهلي المصري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DGWWbn-x.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="__diag" style="position:fixed;top:0;left:0;right:0;background:#1B7A3D;color:#fff;padding:8px 16px;font-size:14px;z-index:999999;font-family:monospace;direction:ltr">
      v8: Loading bundle...
    </div>

    <script>
      var diag = document.getElementById('__diag');
      function diagMsg(msg, bg) {
        diag.textContent = msg;
        if (bg) diag.style.background = bg;
      }

      // Method 1: Try loading as regular script (fetch + eval) to catch runtime errors
      fetch('/assets/index-D-1BwIyM.js')
        .then(function(r) {
          if (!r.ok) { diagMsg('FETCH FAILED: ' + r.status, '#dc2626'); return; }
          return r.text();
        })
        .then(function(code) {
          if (!code) return;
          diagMsg('v8: Bundle fetched (' + code.length + ' chars). Evaluating...');

          // Remove ES module export statement so it can run as regular script
          code = code.replace(/export\{[^}]+\};?\s*$/, '');

          try {
            var fn = new Function(code);
            fn();
            diagMsg('v8: Bundle executed OK! Root has ' + document.getElementById('root').innerHTML.length + ' chars', '#16a34a');
          } catch(e) {
            diagMsg('v8 ERROR: ' + e.message, '#dc2626');
            // Show full error details below
            var errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:40px;left:0;right:0;bottom:0;background:#fff;color:#dc2626;padding:20px;font-family:monospace;font-size:13px;z-index:999998;direction:ltr;overflow:auto;white-space:pre-wrap';
            errDiv.textContent = 'RUNTIME ERROR IN BUNDLE:\n\n' + (e.stack || e.message || String(e));
            document.body.appendChild(errDiv);
          }
        })
        .catch(function(e) {
          diagMsg('v8 NETWORK ERROR: ' + e.message, '#dc2626');
        });
    </script>
  </body>
</html>
