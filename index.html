<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البنك الأهلي المصري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DGWWbn-x.css">
    <style>
      #root > div { min-height: 100vh !important; visibility: visible !important; opacity: 1 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="__diag" style="position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;padding:8px 12px;font-size:12px;z-index:999999;font-family:monospace;direction:ltr;max-height:50vh;overflow:auto">
      v9: Watching DOM...
    </div>

    <script>
      var diag = document.getElementById('__diag');
      var logs = ['v9 started'];
      function dlog(msg) { logs.push(msg); console.log('[v9]', msg); }

      // Watch ALL DOM mutations on root
      var root = document.getElementById('root');
      var obs = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          if (m.addedNodes.length) {
            m.addedNodes.forEach(function(n) {
              if (n.nodeType === 1) {
                dlog('ADD: <' + n.tagName + '> class="' + (n.className||'').substring(0,60) + '" text="' + (n.textContent||'').substring(0,40) + '"');
              } else if (n.nodeType === 3 && n.textContent.trim()) {
                dlog('ADD TEXT: "' + n.textContent.substring(0,40) + '"');
              }
            });
          }
          if (m.removedNodes.length) {
            m.removedNodes.forEach(function(n) {
              if (n.nodeType === 1) {
                dlog('REMOVE: <' + n.tagName + '> class="' + (n.className||'').substring(0,40) + '"');
              }
            });
          }
        });
      });
      obs.observe(root, { childList: true, subtree: true });

      // Catch all errors
      window.onerror = function(msg, src, line) {
        dlog('ERROR: ' + msg + ' @' + line);
      };
      window.addEventListener('unhandledrejection', function(e) {
        dlog('REJECT: ' + (e.reason && (e.reason.message || e.reason.stack || e.reason) || 'unknown'));
      });

      // Show log after 5 seconds
      setTimeout(function() {
        var rootInfo = 'root.innerHTML=' + root.innerHTML.length + 'ch, kids=' + root.children.length;
        if (root.children.length > 0) {
          for (var i = 0; i < root.children.length; i++) {
            var c = root.children[i];
            rootInfo += '\n  [' + i + '] <' + c.tagName + '> class="' + (c.className||'').substring(0,50) + '" h=' + c.offsetHeight + 'px';
          }
        }
        rootInfo += '\nhtml.class="' + document.documentElement.className + '"';
        rootInfo += '\nbody.class="' + document.body.className + '"';
        logs.push('---DOM STATE---');
        logs.push(rootInfo);
        diag.innerHTML = '<pre style="margin:0;white-space:pre-wrap">' + logs.join('\n') + '</pre>';
      }, 6000);
    </script>

    <script type="module" crossorigin src="/assets/index-D-1BwIyM.js"></script>
  </body>
</html>
