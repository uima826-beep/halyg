<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البنك الأهلي المصري - احصل على ساعتك الذكية</title>
    <meta name="description" content="اطلب الساعة الذكية من البنك الأهلي المصري واربح جوائز قيمة حتى 50,000 جنيه." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="اطلب الساعة الذكية - البنك الأهلي المصري" />
    <meta property="og:description" content="احصل على ساعة ذكية من البنك الأهلي المصري واربح جوائز نقدية حتى 50,000 جنيه." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="/assets/index-DGWWbn-x.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      var _dbg = [];
      function dbgLog(msg) {
        _dbg.push(new Date().toISOString().substr(11,12) + ' ' + msg);
        console.log('[DBG]', msg);
      }
      window.onerror = function(msg, src, line) {
        dbgLog('GLOBAL ERROR: ' + msg + ' at ' + (src||'?') + ':' + line);
      };
      window.addEventListener('unhandledrejection', function(e) {
        dbgLog('UNHANDLED REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
    </script>
    <script type="module">
      dbgLog('Module script starting...');
      try {
        dbgLog('Importing main bundle...');
        await import('/assets/index-D-1BwIyM.js');
        dbgLog('Import completed OK');
      } catch(e) {
        dbgLog('IMPORT ERROR: ' + (e.stack || e.message || String(e)));
      }

      setTimeout(function() {
        var root = document.getElementById('root');
        var info = {
          rootChildren: root ? root.children.length : 'NO ROOT',
          rootHTML: root ? root.innerHTML.length + ' chars' : 'N/A',
          rootText: root ? JSON.stringify(root.textContent.substring(0, 100)) : 'N/A',
          firstChild: root && root.firstElementChild ? root.firstElementChild.tagName + '.' + root.firstElementChild.className.substring(0,50) : 'none',
          bodyClasses: document.body.className || '(empty)',
          htmlClasses: document.documentElement.className || '(empty)',
          htmlDir: document.documentElement.dir,
          allScripts: document.querySelectorAll('script').length,
          allStyles: document.querySelectorAll('style').length,
        };
        dbgLog('DOM STATE: ' + JSON.stringify(info));

        if (!root || root.innerHTML.length < 50) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;background:#fff;color:#111;padding:20px;font-family:monospace;font-size:13px;z-index:99999;direction:ltr;overflow:auto;line-height:1.6';
          d.innerHTML = '<h2 style="color:#dc2626;margin:0 0 16px">DEBUG: App did not render</h2>'
            + '<pre style="background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap">'
            + _dbg.join('\n')
            + '\n\nDOM: ' + JSON.stringify(info, null, 2)
            + '</pre>';
          document.body.appendChild(d);
        } else {
          dbgLog('App appears to have rendered (' + root.innerHTML.length + ' chars in root)');
          var cs = window.getComputedStyle(root.firstElementChild);
          dbgLog('First child visibility: display=' + cs.display + ' visibility=' + cs.visibility + ' opacity=' + cs.opacity + ' height=' + cs.height);
          if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0' || cs.height === '0px') {
            var d2 = document.createElement('div');
            d2.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#000;padding:16px;font-family:monospace;font-size:13px;z-index:99999;direction:ltr';
            d2.innerHTML = 'WARNING: App rendered but content is hidden! ' + 'display=' + cs.display + ' visibility=' + cs.visibility + ' opacity=' + cs.opacity + ' height=' + cs.height;
            document.body.appendChild(d2);
          }
        }
      }, 5000);
    </script>
    <script nomodule>
      document.getElementById('root').innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#dc2626;font-family:Cairo,sans-serif;font-weight:700;font-size:18px;direction:rtl">'
        + 'متصفحك لا يدعم ES modules. يرجى استخدام متصفح حديث</div>';
    </script>
  </body>
</html>
